<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語詞與語法練習</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#222; --sub:#6b6b6b; --line:#e4dfd5;
  --accent:#2f5d62; --accent-soft:#e8f0ef;
  --ok:#2e7d4f; --okbg:#e7f4ec; --bad:#b3402f; --badbg:#fbeae6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:18px;margin:0;font-weight:600;cursor:pointer}
.toggles{display:flex;gap:14px;font-size:14px;color:var(--sub)}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.intro{color:var(--sub);font-size:15px;margin:0 0 18px}
.levels{display:grid;gap:12px}
.level{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;cursor:pointer;font:inherit;color:inherit}
.level:hover{border-color:var(--accent)}
.level b{font-size:18px}
.level span{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:14px}
.prompt{font-size:22px;line-height:1.8;margin:6px 0 4px}
.word{font-size:34px;font-weight:600;letter-spacing:.05em}
.py{color:var(--sub);font-size:15px;font-weight:400;letter-spacing:0}
.en{color:var(--sub);font-size:14px;font-weight:400;letter-spacing:0}
.hint{color:var(--sub);font-size:14px;margin:0 0 4px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);text-align:center;color:transparent;user-select:none}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt .t{flex:1}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb .h{font-weight:600;margin-bottom:4px}
.fb em{font-style:normal;background:#fff3b0;padding:0 2px;border-radius:3px}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.score{font-size:30px;font-weight:600;margin:4px 0 12px}
ul.miss{padding-left:20px;margin:8px 0 0;font-size:15px}
ul.miss li{margin-bottom:6px}
footer{margin-top:28px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home">語詞與語法練習</h1>
    <div class="toggles">
      <label><input type="checkbox" id="tpy"> 拼音</label>
      <label><input type="checkbox" id="ten"> 英文</label>
    </div>
  </header>
  <div id="app"></div>
  <footer>資料在檔案最上方的 LESSON 區塊；換課文只需修改那一段。</footer>
</div>

<script>
/* ================= LESSON 資料區（每週只需改這裡）=================
   words[].s ：例句。t 為完整句子（句中必須含該詞），d 為兩個「明顯不適合」的干擾詞。
   第一句為課文原例句；標 new:true 的是補充例句，請老師審閱。
   grammar[] ：t="fill" 填空選句型；t="sent" 選出用法正確的句子。 */
const LESSON = {
  title: "本週課文",
  words: [
    {w:"慶祝",py:"qìngzhù",en:"celebrate",def:"為了高興的事情而進行活動。",s:[
      {t:"我們今天晚上要慶祝媽媽的生日。",d:["宣傳","團聚"]},
      {t:"考試結束了，我們一起去吃大餐慶祝。",d:["祭拜","宣傳"],new:true}]},
    {w:"邀請",py:"yāoqǐng",en:"invite",def:"請別人來參加活動或到某個地方。",s:[
      {t:"阿力邀請Joan去他家烤肉。",d:["弄錯","宣傳"]},
      {t:"謝謝你邀請我參加你的婚禮。",d:["慶祝","祭拜"],new:true}]},
    {w:"團聚",py:"tuánjù",en:"reunion; get together",def:"家人或朋友再一次聚在一起。",s:[
      {t:"中秋節是家人團聚的日子。",d:["宣傳","弄錯"]},
      {t:"過年的時候，在外地工作的人都會回家團聚。",d:["宣傳","弄錯"],new:true}]},
    {w:"難得",py:"nándé",en:"rare; hard to come by",def:"不容易得到或遇到的。",s:[
      {t:"我們平常都很忙，能一起吃飯真是難得。",d:["逐漸","根據"]},
      {t:"今天天氣這麼好，又不用上班，真是難得。",d:["怪不得","逐漸"],new:true}]},
    {w:"農曆",py:"nónglì",en:"lunar calendar",def:"中國傳統的曆法，根據月亮的變化計算日期。",s:[
      {t:"中秋節是農曆八月十五。",d:["傳統","神話"]},
      {t:"我的生日是農曆三月二十，不是國曆。",d:["傳統","關係"],new:true}]},
    {w:"傳統",py:"chuántǒng",en:"tradition; traditional",def:"從過去一直流傳下來的習慣或文化。",s:[
      {t:"吃月餅是中秋節的傳統。",d:["廣告","關係"]},
      {t:"穿旗袍是中國的傳統服裝。",d:["神話","農曆"],new:true}]},
    {w:"關係",py:"guānxì",en:"relationship; connection",def:"兩件事情之間的連結。",s:[
      {t:"烤肉跟中秋節沒有直接的關係。",d:["廣告","農曆"]},
      {t:"你和他是什麼關係？",d:["傳統","廣告"],new:true}]},
    {w:"根據",py:"gēnjù",en:"according to; based on",def:"依照某個資料或說法。",s:[
      {t:"根據天氣預報，明天會下雨。",d:["怪不得","逐漸"]},
      {t:"根據老師的說法，下星期要考試。",d:["難得","弄錯"],new:true}]},
    {w:"怪不得",py:"guàibude",en:"no wonder",def:"找到原因後覺得合理，表示「原來如此」。",s:[
      {t:"怪不得你感冒了，原來昨天淋雨了。",d:["根據","逐漸"]},
      {t:"怪不得這家店人這麼多，原來今天打折。",d:["根據","逐漸"],new:true}]},
    {w:"廣告",py:"guǎnggào",en:"advertisement",def:"用來宣傳商品或活動的訊息。",s:[
      {t:"我在電視上看到一個很有趣的廣告。",d:["農曆","關係"]},
      {t:"這個手機的廣告在網路上很受歡迎。",d:["農曆","關係"],new:true}]},
    {w:"宣傳",py:"xuānchuán",en:"promote; publicize",def:"讓更多人知道一件事情。",s:[
      {t:"公司花很多錢宣傳新產品。",d:["祭拜","弄錯"]},
      {t:"學校用海報宣傳這次的活動。",d:["祭拜","弄錯"],new:true}]},
    {w:"神話",py:"shénhuà",en:"myth; mythology",def:"古代流傳下來關於神或英雄的故事。",s:[
      {t:"嫦娥奔月是一個有名的中國神話。",d:["農曆","關係"]},
      {t:"小時候，奶奶常常講神話故事給我聽。",d:["農曆","關係"],new:true}]},
    {w:"弄錯",py:"nòngcuò",en:"make a mistake; get it wrong",def:"把事情做錯或想錯。",s:[
      {t:"你弄錯了，吃粽子是端午節，不是中秋節。",d:["宣傳","邀請"]},
      {t:"對不起，我弄錯你的名字了。",d:["慶祝","宣傳"],new:true}]},
    {w:"逐漸",py:"zhújiàn",en:"gradually",def:"慢慢地、一點一點地。",s:[
      {t:"天氣逐漸變冷了。",d:["根據","怪不得"]},
      {t:"來台灣半年以後，他逐漸習慣這裡的生活。",d:["根據","怪不得"],new:true}]},
    {w:"習俗",py:"xísú",en:"custom",def:"社會上長久以來形成的生活方式。",s:[
      {t:"每個國家都有不同的節日習俗。",d:["農曆","關係"]},
      {t:"端午節有吃粽子的習俗。",d:["農曆","關係"],new:true}]},
    {w:"祭拜",py:"jìbài",en:"worship; pay respects to",def:"用儀式向神明或祖先表達敬意。",s:[
      {t:"中秋節的時候，人們會祭拜月亮。",d:["邀請","宣傳"]},
      {t:"清明節的時候，很多人會去祖先的墓前祭拜。",d:["邀請","宣傳"],new:true}]}
  ],
  grammar: [
    {p:"就算……也……",t:"fill",q:"＿＿＿明天下大雨，我們＿＿＿要去爬山。",o:["就算…也…","因為…所以…","如果…才…"],full:"就算明天下大雨，我們也要去爬山。",note:"「就算……也……」：即使有某種情況，結果還是一樣。"},
    {p:"就算……也……",t:"sent",o:["就算只有一個人來，我們也會開會。","就算只有一個人來，我們就會開會。","就算只有一個人來，所以我們也會開會。"],note:"「就算」後面的句子用「也」呼應，不用「就」，也不和「所以」一起用；意思是「即使…結果不變」。"},
    {p:"由＋N＋V",t:"fill",q:"這次的旅行計畫，＿＿＿我來負責。",o:["由","對","受到"],full:"這次的旅行計畫，由我來負責。",note:"「由＋N＋V」：說明誰來做這件事、負責這個任務。"},
    {p:"由＋N＋V",t:"sent",o:["這次的活動，由王老師來負責。","這次的活動，王老師由來負責。","這次的活動，來由王老師負責。"],note:"「由」要放在執行者前面：由＋誰＋做什麼。"},
    {p:"對＋人／事物＋來說",t:"fill",q:"＿＿＿小孩子來說，糖果比蔬菜好吃。",o:["對","由","受到"],full:"對小孩子來說，糖果比蔬菜好吃。",note:"「對……來說」：從某個人或事物的角度來看。"},
    {p:"對＋人／事物＋來說",t:"sent",o:["對外國人來說，中文的聲調很難。","外國人對來說，中文的聲調很難。","對外國人來看，中文的聲調很難。"],note:"固定形式是「對＋人／事物＋來說」，人放在「對」和「來說」中間。"},
    {p:"受到＋事物＋的影響",t:"fill",q:"很多年輕人的穿著＿＿＿韓國流行文化的影響。",o:["受到","由","對"],full:"很多年輕人的穿著受到韓國流行文化的影響。",note:"「受到……的影響」：被某個人或事物影響。"},
    {p:"受到＋事物＋的影響",t:"sent",o:["他的想法受到老師的影響。","他的想法受到影響老師。","他的想法老師受到的影響。"],note:"固定形式是「受到＋誰／什麼＋的影響」，「影響」要放在最後。"},
    {p:"也就是說",t:"fill",q:"他每天只睡四個小時。＿＿＿，他的睡眠不夠。",o:["也就是說","就算","受到"],full:"他每天只睡四個小時。也就是說，他的睡眠不夠。",note:"「也就是說」：把前面的話換個方式再說明一次。"},
    {p:"也就是說",t:"sent",o:["這個包包一個要兩萬塊。也就是說，它非常貴。","這個包包一個要兩萬塊。受到說，它非常貴。","這個包包一個要兩萬塊。就是說也，它非常貴。"],note:"「也就是說」放在句首，後面接重新說明的內容。"}
  ]
};
/* ================= 以下為程式，不需修改 ================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LEVELS = [
  {id:1, name:"初階", desc:"詞義：三選一，選出這個詞的意思", n:() => LESSON.words.length},
  {id:2, name:"中階", desc:"用法：看例句，選出該填入的詞", n:() => LESSON.words.length},
  {id:3, name:"進階", desc:"語法：選出正確的句型用法", n:() => LESSON.grammar.length}
];

let prefs = {py:true, en:false};
try { Object.assign(prefs, JSON.parse(localStorage.getItem('prefs') || '{}')); } catch (e) {}
let run = null;

function savePrefs(){ try { localStorage.setItem('prefs', JSON.stringify(prefs)); } catch (e) {} }

/* ---------- 題目產生 ---------- */
function buildQ(level, id, lastSent){
  const W = LESSON.words;
  if (level === 1) {
    const w = W[id];
    const others = shuffle(W.filter((_, i) => i !== id)).slice(0, 2);
    const options = shuffle([{text:w.def, correct:true}, ...others.map(o => ({text:o.def, correct:false}))]);
    return {
      promptFn: () => `<div class="hint">這個詞是什麼意思？</div><div class="prompt"><span class="word">${esc(w.w)}</span>
        ${prefs.py ? `<span class="py"> ${esc(w.py)}</span>` : ''}${prefs.en ? `<span class="en"> ${esc(w.en)}</span>` : ''}</div>`,
      options,
      fb: `<b>${esc(w.w)}</b>（${esc(w.py)}）：${esc(w.def)}<br>例：${esc(w.s[0].t)}`,
      label: `${w.w}：${w.def}`
    };
  }
  if (level === 2) {
    const w = W[id];
    let k = Math.floor(Math.random() * w.s.length);
    if (w.s.length > 1 && k === lastSent) k = (k + 1) % w.s.length;
    const s = w.s[k];
    const byWord = x => W.find(o => o.w === x);
    const mk = (o, correct) => ({text:o.w, py:o.py, en:o.en, correct});
    const options = shuffle([mk(w, true), ...s.d.map(x => mk(byWord(x), false))]);
    const blank = esc(s.t).replace(esc(w.w), '<span class="blank">＿＿＿</span>');
    const full = esc(s.t).replace(esc(w.w), `<em>${esc(w.w)}</em>`);
    return {
      sent: k,
      prompt: `<div class="hint">選出最適合填入空格的詞</div><div class="prompt">${blank}</div>`,
      options,
      fb: `${full}<br><b>${esc(w.w)}</b>：${esc(w.def)}`,
      label: s.t
    };
  }
  const g = LESSON.grammar[id];
  const options = shuffle(g.o.map((t, i) => ({text:t, correct:i === 0})));
  if (g.t === 'fill') {
    return {
      prompt: `<div class="hint">選出適合填入空格的句型</div><div class="prompt">${esc(g.q).replace(/＿＿＿/g, '<span class="blank">＿＿＿</span>')}</div>`,
      options,
      fb: `${esc(g.full)}<br>${esc(g.note)}`,
      label: g.full
    };
  }
  return {
    prompt: `<div class="hint">哪一句「${esc(g.p)}」用得正確？</div>`,
    options,
    fb: `正確：${esc(g.o[0])}<br>${esc(g.note)}`,
    label: g.o[0]
  };
}

/* ---------- 畫面 ---------- */
function home(){
  run = null;
  $('#app').innerHTML = `<div class="card">
    <p class="intro">${esc(LESSON.title)}：${LESSON.words.length} 個詞語、${new Set(LESSON.grammar.map(g => g.p)).size} 個語法。
    答錯的題目會再出現，直到答對為止。沒有計時，也沒有分數排行。</p>
    <div class="levels">${LEVELS.map(l => `<button class="level" data-level="${l.id}"><b>${l.name}</b><span>${l.desc}（${l.n()} 題）</span></button>`).join('')}</div>
  </div>`;
}

function start(level, ids){
  ids = ids || (level === 3 ? LESSON.grammar : LESSON.words).map((_, i) => i);
  run = {level, ids:ids.slice(), queue:shuffle(ids), total:ids.length, done:0, first:{}, last:{}, answered:false, q:null, cur:null};
  next();
}

function next(){
  if (!run.queue.length) return result();
  run.cur = run.queue.shift();
  run.q = buildQ(run.level, run.cur, run.last[run.cur]);
  run.last[run.cur] = run.q.sent;
  run.answered = false;
  renderQ(-1);
}

function renderQ(picked){
  const q = run.q;
  const lv = LEVELS[run.level - 1];
  const opts = q.options.map((o, i) => {
    let cls = 'opt';
    if (run.answered) cls += o.correct ? ' ok' : (i === picked ? ' bad' : '');
    let inner = esc(o.text);
    if (run.level === 2) {
      const extra = [prefs.py ? o.py : '', prefs.en ? o.en : ''].filter(Boolean).join(' · ');
      inner = `<span style="font-size:20px">${esc(o.text)}</span>${extra ? ` <span class="py">${esc(extra)}</span>` : ''}`;
    }
    return `<button class="${cls}" data-i="${i}" ${run.answered ? 'disabled' : ''}><span class="n">${i + 1}</span><span class="t">${inner}</span></button>`;
  }).join('');
  let fb = '';
  if (run.answered) {
    const ok = q.options[picked].correct;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="h">${ok ? '答對了' : '再想想，這題等一下會再出現'}</div>${q.fb}</div>
      <button class="btn" id="next">下一題</button>`;
  }
  $('#app').innerHTML = `<div class="card">
    <div class="bar"><i style="width:${run.done / run.total * 100}%"></i></div>
    <div class="meta"><span>${lv.name}</span><span>已答對 ${run.done} / ${run.total}</span></div>
    ${q.promptFn ? q.promptFn() : q.prompt}<div class="opts">${opts}</div>${fb}</div>`;
}

function answer(i){
  if (run.answered) return;
  run.answered = true;
  const ok = run.q.options[i].correct;
  if (run.first[run.cur] === undefined) run.first[run.cur] = ok;
  if (ok) run.done++;
  else run.queue.splice(Math.min(3, run.queue.length), 0, run.cur);
  renderQ(i);
}

function result(){
  const missed = run.ids.filter(id => run.first[id] === false);
  const good = run.total - missed.length;
  const missList = missed.map(id => `<li>${esc(buildQ(run.level, id).label)}</li>`).join('');
  $('#app').innerHTML = `<div class="card">
    <div class="hint">${LEVELS[run.level - 1].name}完成</div>
    <div class="score">第一次就答對 ${good} / ${run.total}</div>
    ${missed.length ? `<div>需要再看一下：<ul class="miss">${missList}</ul></div>` : '<div>全部第一次就答對。</div>'}
    <div class="row">
      ${missed.length ? `<button class="btn" id="redo-miss">只練答錯的</button>` : ''}
      <button class="btn ${missed.length ? 'ghost' : ''}" id="redo-all">整組重練</button>
      <button class="btn ghost" id="to-home">回首頁</button>
    </div></div>`;
  run.missedIds = missed;
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, #home');
  if (!t) return;
  if (t.id === 'home' || t.id === 'to-home') return home();
  if (t.dataset.level) return start(+t.dataset.level);
  if (t.dataset.i !== undefined && run) return answer(+t.dataset.i);
  if (t.id === 'next') return next();
  if (t.id === 'redo-all') return start(run.level);
  if (t.id === 'redo-miss') return start(run.level, run.missedIds);
});
document.addEventListener('keydown', e => {
  if (!run || !run.q) return;
  if (!run.answered && /^[1-3]$/.test(e.key)) return answer(+e.key - 1);
  if (run.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
});
['py', 'en'].forEach(k => {
  const el = $('#t' + k);
  el.checked = !!prefs[k];
  el.addEventListener('change', () => {
    prefs[k] = el.checked; savePrefs();
    if (run && run.q && !run.answered) renderQ(-1);
  });
});
home();
</script>
</body>
</html>
